<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>L O V E 6 - Fountain</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- Google Fonts — 18 families loaded for dynamic typographic effects -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@400;700;900&family=Space+Mono:wght@400;700&family=Abril+Fatface&family=Righteous&family=Lobster&family=Oswald:wght@300;700&family=Dancing+Script:wght@700&family=Anton&family=Raleway:wght@100;900&family=Cormorant+Garamond:ital,wght@1,700&family=Pacifico&family=Black+Han+Sans&family=Cinzel:wght@900&family=Monoton&family=Bungee&family=Protest+Guerrilla&family=Bruno+Ace+SC&display=swap" rel="stylesheet" />

  <!-- Matter.js Physics Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: sans-serif;
      touch-action: none;
    }

    #matter-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
    }
  </style>
</head>
<body>

<canvas id="matter-canvas"></canvas>

<script>
/* ───────────────────────────────────────────
   1. ASSETS & PALETTES
─────────────────────────────────────────────*/
const FONTS = [
  "'Bebas Neue', sans-serif", "'Playfair Display', serif", "'Space Mono', monospace",
  "'Abril Fatface', cursive", "'Righteous', cursive", "'Lobster', cursive",
  "'Oswald', sans-serif", "'Dancing Script', cursive", "'Anton', sans-serif",
  "'Raleway', sans-serif", "'Cormorant Garamond', serif", "'Pacifico', cursive",
  "'Cinzel', serif", "'Monoton', cursive", "'Bungee', cursive",
  "'Protest Guerrilla', sans-serif", "'Bruno Ace SC', cursive",
];

const ALL_COLORS = [
  '#FF2D55','#FF9F0A','#30D158','#0A84FF','#BF5AF2','#FF375F',
  '#FFD60A','#4ECDC4','#F72585','#4CC9F0','#06FFA5','#FF2979',
  '#FF6B00','#FF0099','#00FFCC','#B400FF','#FFBE0B','#FB5607',
  '#FF006E','#8338EC','#00F5D4','#F15BB5','#FEE440','#00BBF9',
  '#FF4D6D','#C77DFF','#FFD166','#06D6A0','#39FF14','#FF073A',
  '#0FF0FC','#FF6EC7',
];

const IMAGE_COLORS = [
  '#19FF3B', '#FFDE19', '#19FF7F', '#45FF19', '#FF19E0', 
  '#FFA519', '#6719FF', '#198FFF', '#FF1922', '#FF8719'
];

function pickFont() { return FONTS[Math.floor(Math.random() * FONTS.length)]; }
function pickColor() { return ALL_COLORS[Math.floor(Math.random() * ALL_COLORS.length)]; }


/* ───────────────────────────────────────────
   2. PHYSICS SETUP
─────────────────────────────────────────────*/
const Engine = Matter.Engine,
      Render = Matter.Render,
      Runner = Matter.Runner,
      World = Matter.World,
      Bodies = Matter.Bodies,
      Body = Matter.Body,
      Composite = Matter.Composite,
      Mouse = Matter.Mouse,
      MouseConstraint = Matter.MouseConstraint;

const canvas = document.getElementById('matter-canvas');
const ctx = canvas.getContext('2d');

let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

// Normal downward gravity
const engine = Engine.create();
engine.world.gravity.y = 1;
engine.world.gravity.x = 0;

// Interactive mouse constraint (Allows user to interact with the fountain)
const mouse = Mouse.create(canvas);
const mouseConstraint = MouseConstraint.create(engine, {
  mouse: mouse,
  constraint: {
    stiffness: 0.1,
    render: { visible: false }
  }
});
Composite.add(engine.world, mouseConstraint);


/* ───────────────────────────────────────────
   3. FOUNTAIN SPAWNING LOGIC
─────────────────────────────────────────────*/
function spawnFountain() {
  const isLetter = Math.random() < 0.3; // 30% chance to be a letter
  // Spread the "nozzle" slightly so they don't explode from exact same pixel
  const startX = width / 2 + (Math.random() - 0.5) * 60; 
  const startY = height + 30; 
  
  // Smaller, more numerous particles for a fluid-like flow
  const r = 8 + Math.random() * 18; 
  
  let body;
  if (isLetter) {
    body = Bodies.circle(startX, startY, r, {
      restitution: 0.2, 
      friction: 0.01,
      frictionAir: 0.005,
      density: 0.05,
      collisionFilter: { group: -1 }, // Prevent mid-air collisions so they flow smoothly like water
      label: 'letter'
    });
    
    body.custom = {
      char: ['L','O','V','E'][Math.floor(Math.random() * 4)],
      font: pickFont(),
      color: pickColor(),
      lastChange: Date.now(),
      changeInterval: 300 + Math.random() * 800 // 0.3s ~ 1.1s
    };
  } else {
    body = Bodies.circle(startX, startY, r, {
      restitution: 0.2, 
      friction: 0.01,
      frictionAir: 0.005,
      density: 0.05,
      collisionFilter: { group: -1 }, // Prevent mid-air collisions so they flow smoothly like water
      label: 'ball'
    });
    
    body.custom = {
      color: IMAGE_COLORS[Math.floor(Math.random() * IMAGE_COLORS.length)],
      r: r
    };
  }
  
  // Fountain velocity calculation - Lower height, wider spread
  const SPRAY_FORCE = Math.sqrt(height * 0.75); 
  
  // Wider horizontal spread
  const vx = (Math.random() - 0.5) * (SPRAY_FORCE * 0.6); 
  const vy = -(SPRAY_FORCE + Math.random() * (SPRAY_FORCE * 0.15)); 
  
  Body.setVelocity(body, { x: vx, y: vy });
  Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.4); 
  
  Composite.add(engine.world, body);
}

// Spawn continuously very fast for a realistic stream (approx 60 objects per second)
setInterval(spawnFountain, 16);


/* ───────────────────────────────────────────
   4. RENDER LOOP & CLEANUP
─────────────────────────────────────────────*/
const runner = Runner.create();
Runner.run(runner, engine);

function render() {
  ctx.clearRect(0, 0, width, height);
  const bodies = Composite.allBodies(engine.world);
  const now = Date.now();
  
  for (let body of bodies) {
    // 1. Cleanup bodies that have fallen completely off screen
    // Only remove them if they are falling DOWN (velocity.y > 0) 
    // to prevent removing them when they are just being shot up from the bottom.
    if ((body.position.y > height + 150 && body.velocity.y > 0) ||
        body.position.x < -300 || 
        body.position.x > width + 300) {
      Composite.remove(engine.world, body);
      continue;
    }
    
    // 2. Rendering
    const { position, angle } = body;
    ctx.save();
    ctx.translate(position.x, position.y);
    ctx.rotate(angle);
    
    if (body.label === 'ball') {
      const r = body.custom.r;

      // Plain colored circle with neon glow
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.shadowBlur  = 28;
      ctx.shadowColor = body.custom.color;
      ctx.fillStyle   = body.custom.color;
      ctx.fill();
      // Bright inner core
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.48, 0, Math.PI * 2);
      ctx.fillStyle = body.custom.color + 'CC';
      ctx.shadowBlur = 12;
      ctx.fill();
      
    } else if (body.label === 'letter') {
      // Dynamic style updating: 0.3s ~ 1.1s
      if (now - body.custom.lastChange > body.custom.changeInterval) {
        body.custom.font = pickFont();
        body.custom.color = pickColor();
        body.custom.lastChange = now;
      }
      
      const r = body.circleRadius;
      ctx.fillStyle = body.custom.color;
      ctx.font = `${r * 1.8}px ${body.custom.font}`; 
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      ctx.shadowBlur = 20;
      ctx.shadowColor = body.custom.color;
      
      ctx.fillText(body.custom.char, 0, 0);
    }
    
    ctx.restore();
  }
  
  requestAnimationFrame(render);
}

render();

/* ───────────────────────────────────────────
   5. RESIZE HANDLING
─────────────────────────────────────────────*/
window.addEventListener('resize', () => {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
});

</script>
</body>
</html>
