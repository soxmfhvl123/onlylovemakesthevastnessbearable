<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONLY LOVE MAKES THE VASTNESS BEARABLE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@400;700;900&family=Space+Mono:wght@400;700&family=Abril+Fatface&family=Righteous&family=Lobster&family=Oswald:wght@300;700&family=Dancing+Script:wght@700&family=Anton&family=Raleway:wght@100;900&family=Cormorant+Garamond:ital,wght@1,700&family=Pacifico&family=Black+Han+Sans&family=Cinzel:wght@900&family=Monoton&family=Bungee&family=Protest+Guerrilla&family=Bruno+Ace+SC&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }

    body {
      background: #000;
      overflow-x: hidden;
      overflow-y: scroll;
    }

    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── HERO — full viewport, title centered ── */
    .hero {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      scroll-snap-align: start;
    }

    #title-stage {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0px;
      user-select: none;
      filter: drop-shadow(0 0 40px rgba(255,255,255,0.06));
      z-index: 100;
      cursor: pointer;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1),
                  top 0.8s cubic-bezier(0.25, 1, 0.5, 1),
                  filter 0.8s ease;
    }

    #title-stage.fixed-top {
      top: 85px;
      transform: translate(-50%, -50%) scale(0.26);
      filter: drop-shadow(0 0 20px rgba(255,255,255,0.12));
    }

    .title-line {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .letter {
      display: inline-block;
      font-weight: 900;
      font-size: clamp(46px, 7.8vw, 136px);
      line-height: 0.91;
      will-change: transform, color;
    }

    .letter.animate {
      transition:
        font-family 0.05s,
        color 0.5s ease,
        transform 0.7s cubic-bezier(0.34,1.56,0.64,1),
        text-shadow 0.5s ease;
    }

    .letter.space {
      width: clamp(12px, 1.9vw, 32px);
    }

    /* ── PROJECTS section ── */
    .projects {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 38vh 24px 25vh 24px; /* LOVE 컨텐츠가 화면 중앙보다 살짝 위에 오도록 패딩 설정 */
      scroll-snap-align: start;
    }

    .links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .link-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      transition: filter 0.3s ease;
      position: relative;
    }

    .link-row:hover {
      filter: drop-shadow(0 0 28px rgba(255,255,255,0.22));
    }

    /* Base Cute Speech Bubble style */
    .click-me-bubble {
      position: absolute;
      color: #fff;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      z-index: 20;
    }

    /* 1. Right positioned bubble (Default) */
    .click-me-bubble.bubble-right {
      top: -24px;
      left: calc(100% - 15px);
      background: linear-gradient(135deg, #FF2979, #FF9F0A);
      box-shadow: 0 0 15px rgba(255, 41, 121, 0.6);
      animation: bubbleFloat 1.8s ease-in-out infinite alternate;
    }
    .click-me-bubble.bubble-right::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 12px;
      border-width: 6px 6px 0 0;
      border-style: solid;
      border-color: #FF2979 transparent transparent transparent;
      display: block;
      width: 0;
    }

    /* 2. Left positioned bubble */
    .click-me-bubble.bubble-left {
      top: -24px;
      right: calc(100% - 15px);
      background: linear-gradient(135deg, #FF2979, #FF9F0A);
      box-shadow: 0 0 15px rgba(255, 41, 121, 0.6);
      animation: bubbleFloatLeft 1.8s ease-in-out infinite alternate;
    }
    .click-me-bubble.bubble-left::after {
      content: '';
      position: absolute;
      bottom: -5px;
      right: 12px;
      border-width: 6px 0 0 6px;
      border-style: solid;
      border-color: #FF2979 transparent transparent transparent;
      display: block;
      width: 0;
    }

    /* 3. Top positioned bubble (for VASTNESS V) */
    .click-me-bubble.bubble-top {
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #BF5AF2, #FF2D55);
      box-shadow: 0 0 15px rgba(191, 90, 242, 0.6);
      animation: bubbleFloatTop 1.8s ease-in-out infinite alternate;
    }
    .click-me-bubble.bubble-top::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 5px 5px 0 5px;
      border-style: solid;
      border-color: #BF5AF2 transparent transparent transparent;
      display: block;
      width: 0;
    }

    /* 4. Bottom positioned bubble (for FOUNTAIN T) */
    .click-me-bubble.bubble-bottom {
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #0A84FF, #00FFCC);
      box-shadow: 0 0 15px rgba(10, 132, 255, 0.6);
      animation: bubbleFloatBottom 1.8s ease-in-out infinite alternate;
    }
    .click-me-bubble.bubble-bottom::after {
      content: '';
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 5px 5px 5px;
      border-style: solid;
      border-color: transparent transparent #0A84FF transparent;
      display: block;
      width: 0;
    }

    /* Floating Animations */
    @keyframes bubbleFloat {
      0% { transform: translateY(0) rotate(3deg); }
      100% { transform: translateY(-6px) rotate(-3deg); }
    }
    @keyframes bubbleFloatLeft {
      0% { transform: translateY(0) rotate(-3deg); }
      100% { transform: translateY(-6px) rotate(3deg); }
    }
    @keyframes bubbleFloatTop {
      0% { transform: translateX(-50%) translateY(0) rotate(1.5deg); }
      100% { transform: translateX(-50%) translateY(-6px) rotate(-1.5deg); }
    }
    @keyframes bubbleFloatBottom {
      0% { transform: translateX(-50%) translateY(0) rotate(-1.5deg); }
      100% { transform: translateX(-50%) translateY(6px) rotate(1.5deg); }
    }

    /* Cute Speech Bubble for Title */
    .title-click-me-bubble {
      position: absolute;
      top: -28px;
      left: calc(100% - 35px);
      background: linear-gradient(135deg, #06FFA5, #00B4FF);
      color: #fff;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 14px;
      white-space: nowrap;
      box-shadow: 0 0 20px rgba(6, 255, 165, 0.6), 0 0 5px rgba(0, 180, 255, 0.4);
      animation: bubbleFloatTitle 2s ease-in-out infinite alternate;
      pointer-events: none;
      user-select: none;
      z-index: 120;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .title-click-me-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 14px;
      border-width: 6px 6px 0 0;
      border-style: solid;
      border-color: #06FFA5 transparent transparent transparent;
      display: block;
      width: 0;
    }

    #title-stage.fixed-top .title-click-me-bubble {
      opacity: 0;
      transform: scale(0) translateY(-20px);
      pointer-events: none;
    }

    @keyframes bubbleFloatTitle {
      0% {
        transform: translateY(0) rotate(-2deg);
      }
      100% {
        transform: translateY(-8px) rotate(4deg);
      }
    }

    .link-letter {
      display: inline-block;
      font-weight: 900;
      font-size: clamp(18px, 3vw, 48px);
      line-height: 0.95;
      will-change: transform, color;
      position: relative;
    }

    .link-letter.animate {
      transition:
        font-family 0.05s,
        color 0.5s ease,
        transform 0.7s cubic-bezier(0.34,1.56,0.64,1),
        text-shadow 0.5s ease;
    }

    .link-letter.space {
      width: clamp(5px, 0.8vw, 13px);
    }

    /* ── RESPONSIVE & MOBILE OPTIMIZATIONS ── */
    @media (max-width: 768px), (max-height: 780px) {
      html {
        scroll-snap-type: none; /* 소형/모바일 화면에서 스크롤 스냅 해제하여 갇힘 방지 */
      }
      
      .hero {
        scroll-snap-align: none;
      }

      .projects {
        scroll-snap-align: none;
        padding-top: 38vh; /* 소형 화면에서도 LOVE가 화면 중앙보다 살짝 위에 오도록 패딩 일치 */
        padding-bottom: 25vh; /* 하단 넉넉한 스크롤 확보 */
      }

      #title-stage.fixed-top {
        top: 50px;
        transform: translate(-50%, -50%) scale(0.18); /* 타이틀 크기를 모바일 뷰에 맞춰 대폭 축소 */
      }

      .links {
        gap: 16px; /* 프로젝트 간격을 좁혀 한눈에 많이 보이게 유도 */
      }

      .link-letter {
        font-weight: 900;
        font-size: clamp(15px, 4.2vw, 32px); /* 프로젝트 글꼴 크기 축소 */
      }

      .link-letter.space {
        width: clamp(4px, 1.2vw, 9px);
      }
      
      .title-click-me-bubble {
        display: none; /* 모바일에서는 타이틀 툴팁 제거하여 미관 정리 */
      }
    }
  </style>
</head>
<body>

<canvas id="bg"></canvas>

<!-- HERO: title full viewport -->
<section class="hero">
  <div id="title-stage">
    <div class="title-click-me-bubble">click me! <span>✨</span></div>
    <div class="title-line" id="line1"></div>
    <div class="title-line" id="line2"></div>
    <div class="title-line" id="line3"></div>
  </div>

</section>

<!-- PROJECTS: below the fold -->
<section class="projects">
  <nav class="links" id="links"></nav>
</section>

<script>
/* ─────────────────────────────────────────
   ASSETS
───────────────────────────────────────── */
const FONTS = [
  "'Bebas Neue', sans-serif",
  "'Playfair Display', serif",
  "'Space Mono', monospace",
  "'Abril Fatface', cursive",
  "'Righteous', cursive",
  "'Lobster', cursive",
  "'Oswald', sans-serif",
  "'Dancing Script', cursive",
  "'Anton', sans-serif",
  "'Raleway', sans-serif",
  "'Cormorant Garamond', serif",
  "'Pacifico', cursive",
  "'Cinzel', serif",
  "'Monoton', cursive",
  "'Bungee', cursive",
  "'Protest Guerrilla', sans-serif",
  "'Bruno Ace SC', cursive",
];

const ALL_COLORS = [
  '#FF2D55','#FF9F0A','#30D158','#0A84FF','#BF5AF2','#FF375F',
  '#FFD60A','#4ECDC4','#F72585','#4CC9F0','#06FFA5','#FF2979',
  '#FF6B00','#FF0099','#00FFCC','#B400FF','#FFBE0B','#FB5607',
  '#FF006E','#8338EC','#00F5D4','#F15BB5','#FEE440','#00BBF9',
  '#FF4D6D','#C77DFF','#FFD166','#06D6A0','#39FF14','#FF073A',
  '#0FF0FC','#FF6EC7',
];

function pickFont(exclude = []) {
  let f;
  do { f = FONTS[Math.floor(Math.random() * FONTS.length)]; }
  while (exclude.includes(f));
  return f;
}

function pickColor(exclude = []) {
  const pool = ALL_COLORS.filter(c => !exclude.includes(c));
  return pool[Math.floor(Math.random() * pool.length)];
}

function glowShadow(color) {
  return `0 0 12px ${color}aa, 0 0 25px ${color}33`;
}

function randomScale()     { return 0.80 + Math.random() * 0.44; }
function randomTranslate() { return (Math.random() - 0.5) * 26; }

/* ─────────────────────────────────────────
   BACKGROUND
───────────────────────────────────────── */
const canvas = document.getElementById('bg');
const bgCtx  = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const ASCII = 'LOVE♥01アイウエオ∑∆Ω∞≈αβγδ⚡★░▒▓';

// 화면 너비 기준 동적 수량 설정 (모바일에서 렉 완전 차단)
const isMobileDevice = window.innerWidth <= 768;
const particleCount = isMobileDevice ? 24 : 48;
const charCount     = isMobileDevice ? 16 : 28;

const particles = Array.from({ length: particleCount }, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  r: Math.random() * 1.5 + 0.3,
  vx: (Math.random() - 0.5) * 0.3,
  vy: (Math.random() - 0.5) * 0.3,
  alpha: Math.random() * 0.45 + 0.1,
  color: ALL_COLORS[Math.floor(Math.random() * ALL_COLORS.length)],
}));

// 플로팅 캐릭터 크기 후보를 고정(이산화)하여 ctx.font 변경 부담을 극적으로 낮춤
const CHAR_SIZES = [9, 13, 18];
const floatChars = Array.from({ length: charCount }, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  char: ASCII[Math.floor(Math.random() * ASCII.length)],
  size: CHAR_SIZES[Math.floor(Math.random() * CHAR_SIZES.length)],
  speed: Math.random() * 0.25 + 0.08,
  alpha: Math.random() * 0.22 + 0.04,
  color: ALL_COLORS[Math.floor(Math.random() * ALL_COLORS.length)],
  timer: Math.random() * 120,
}));

function drawBg() {
  // clearRect를 굳이 호출하지 않고 fillRect 만으로도 덮어쓰기가 가능하여 버퍼 클리어 오버헤드 절감
  bgCtx.fillStyle = '#000';
  bgCtx.fillRect(0, 0, canvas.width, canvas.height);

  let lastFont = '';

  // Draw floating characters - Single high-speed draw (simulated glow with subtle alpha scale)
  floatChars.forEach(fc => {
    fc.y -= fc.speed;
    fc.timer--;
    if (fc.y < -30) { 
      fc.y = canvas.height + 20; 
      fc.x = Math.random() * canvas.width; 
    }
    if (fc.timer <= 0) { 
      fc.char = ASCII[Math.floor(Math.random() * ASCII.length)]; 
      fc.timer = 40 + Math.random() * 100; 
    }
    
    const fontStr = `${fc.size}px 'Space Mono', monospace`;
    if (fontStr !== lastFont) {
      bgCtx.font = fontStr;
      lastFont = fontStr;
    }
    
    bgCtx.fillStyle = fc.color;
    bgCtx.globalAlpha = fc.alpha * 1.4; // 1회 그리되, 투명도를 보완하여 선명하고 영롱한 Glow 감성 유지
    bgCtx.fillText(fc.char, fc.x, fc.y);
  });

  // Draw particles - Single high-speed arc draw
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width)  p.x = 0;
    if (p.y < 0) p.y = canvas.height;
    if (p.y > canvas.height) p.y = 0;
    
    bgCtx.fillStyle = p.color;
    bgCtx.globalAlpha = p.alpha * 1.3;
    bgCtx.beginPath();
    bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    bgCtx.fill();
  });

  requestAnimationFrame(drawBg);
}
drawBg();

/* ─────────────────────────────────────────
   BUILD SPANS — style applied before DOM insert
───────────────────────────────────────── */
function buildLetterSpans(text, container, className) {
  const spans  = [];
  const states = [];

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];

    if (ch === ' ') {
      const sp = document.createElement('span');
      sp.className   = className + ' space';
      sp.textContent = '\u00A0';
      container.appendChild(sp);
      spans.push(null);
      states.push(null);
      continue;
    }

    const span       = document.createElement('span');
    span.textContent = ch;
    span.className   = className; // no transition yet

    // Apply random style BEFORE appending → first paint is already styled
    const initFont  = pickFont();
    const initColor = pickColor();
    span.style.fontFamily = initFont;
    span.style.color      = initColor;
    span.style.textShadow = glowShadow(initColor);
    span.style.transform  = `scaleY(${randomScale()}) translateY(${randomTranslate()}px)`;

    container.appendChild(span);
    spans.push(span);
    states.push({ prevFont: initFont, color: initColor });
  }

  return { spans, states };
}

/* ─────────────────────────────────────────
   CYCLING ANIMATION & INTERSECTION OBSERVER
───────────────────────────────────────── */
let isHeroVisible = true;
let isProjectsVisible = false;

function animateLetter(spans, states, index, isHeroLetter) {
  // 가시성에 따라 애니메이션 즉시 탈출 (불필요한 리플로우 완전 방지)
  if (isHeroLetter && !isHeroVisible) return;
  if (!isHeroLetter && !isProjectsVisible) return;

  const span  = spans[index];
  const state = states[index];
  if (!span || !state) return;

  const font = pickFont([state.prevFont]);
  state.prevFont = font;

  const nbColors = [
    index > 0              && states[index - 1] ? states[index - 1].color : null,
    index < spans.length-1 && states[index + 1] ? states[index + 1].color : null,
  ].filter(Boolean);
  const color = pickColor(nbColors);
  state.color = color;

  span.style.fontFamily = font;
  span.style.color      = color;
  span.style.textShadow = glowShadow(color);
  span.style.transform  = `scaleY(${randomScale()}) translateY(${randomTranslate()}px)`;

  // 타이머 주기를 1000~3000ms로 조절하여 변경 빈도를 낮춤 (렉 차단의 결정적 비결)
  state.timerId = setTimeout(() => {
    animateLetter(spans, states, index, isHeroLetter);
  }, 1000 + Math.random() * 2000);
}

function startLetters(isHero) {
  if (isHero) {
    allTitleSpans.forEach((span, i) => {
      if (!span || !allTitleStates[i]) return;
      clearTimeout(allTitleStates[i].timerId);
      animateLetter(allTitleSpans, allTitleStates, i, true);
    });
  } else {
    linkSpanGroups.forEach(({ spans, states }) => {
      spans.forEach((span, i) => {
        if (!span || !states[i]) return;
        clearTimeout(states[i].timerId);
        animateLetter(spans, states, i, false);
      });
    });
  }
}

function stopLetters(isHero) {
  if (isHero) {
    allTitleSpans.forEach((span, i) => {
      if (allTitleStates[i]) {
        clearTimeout(allTitleStates[i].timerId);
      }
    });
  } else {
    linkSpanGroups.forEach(({ spans, states }) => {
      spans.forEach((span, i) => {
        if (states[i]) {
          clearTimeout(states[i].timerId);
        }
      });
    });
  }
}

// 뷰포트 진입 감지용 IntersectionObserver 설정
const heroSection = document.querySelector('.hero');
const projectsSection = document.querySelector('.projects');

const visibilityObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.target === heroSection) {
      if (entry.isIntersecting) {
        if (!isHeroVisible) {
          isHeroVisible = true;
          startLetters(true);
        }
      } else {
        if (isHeroVisible) {
          isHeroVisible = false;
          stopLetters(true);
        }
      }
    } else if (entry.target === projectsSection) {
      if (entry.isIntersecting) {
        if (!isProjectsVisible) {
          isProjectsVisible = true;
          startLetters(false);
        }
      } else {
        if (isProjectsVisible) {
          isProjectsVisible = false;
          stopLetters(false);
        }
      }
    }
  });
}, { threshold: 0.05 });

// 관찰 개시
visibilityObserver.observe(heroSection);
visibilityObserver.observe(projectsSection);

/* ─────────────────────────────────────────
   BUILD TITLE — 3 lines
───────────────────────────────────────── */
const TITLE_LINES = ['ONLY LOVE MAKES', 'THE VASTNESS', 'BEARABLE'];
const allTitleSpans  = [];
const allTitleStates = [];

TITLE_LINES.forEach((line, li) => {
  const container = document.getElementById(`line${li + 1}`);
  const { spans, states } = buildLetterSpans(line, container, 'letter');
  allTitleSpans.push(...spans);
  allTitleStates.push(...states);
});

/* ─────────────────────────────────────────
   BUILD PROJECT LINKS
───────────────────────────────────────── */
const PROJECTS = [
  { href: '../love/index.html',  label: 'LOVE' },
  { href: '../love2/index.html', label: 'THE COLLISION' },
  { href: '../love3/index.html', label: 'THE GRAVITY BALL PIT' },
  { href: '../love4/index.html', label: 'FLOATING AND TRAIL' },
  { href: '../love5/index.html', label: 'THE VASTNESS' },
  { href: '../love6/index.html', label: 'FOUNTAIN' },
  { href: '../love7/index.html', label: 'CLOCK' },
  { href: '../love8/index.html', label: 'WIND' },
];

const linksEl        = document.getElementById('links');
const linkSpanGroups = [];

PROJECTS.forEach(proj => {
  const a     = document.createElement('a');
  a.href      = proj.href;
  a.className = 'link-row';
  const { spans, states } = buildLetterSpans(proj.label, a, 'link-letter');

  if (proj.label === 'LOVE') {
    const bubble = document.createElement('div');
    bubble.className = 'click-me-bubble bubble-right';
    bubble.innerHTML = 'click me! <span>💕</span>';
    a.appendChild(bubble);
  }

  linksEl.appendChild(a);
  linkSpanGroups.push({ spans, states });
});

/* ─────────────────────────────────────────
   INTERACTION: CLICK TO SCROLL & STICKY TITLE
───────────────────────────────────────── */
const titleStage = document.getElementById('title-stage');

titleStage.addEventListener('click', () => {
  if (titleStage.classList.contains('fixed-top')) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    projectsSection.scrollIntoView({ behavior: 'smooth' });
  }
});

function handleScroll() {
  const scrollTop = window.scrollY || document.documentElement.scrollTop;
  const threshold = window.innerHeight * 0.35; // 35% of viewport height
  
  if (scrollTop > threshold) {
    titleStage.classList.add('fixed-top');
  } else {
    titleStage.classList.remove('fixed-top');
  }
}

window.addEventListener('scroll', handleScroll);
// Run on initial load
handleScroll();

/* ─────────────────────────────────────────
   START — enable transitions THEN kick off
   ALL letters simultaneously based on viewport
───────────────────────────────────────── */
requestAnimationFrame(() => {
  requestAnimationFrame(() => {

    // Enable transitions now (initial state already painted)
    document.querySelectorAll('.letter').forEach(el => el.classList.add('animate'));
    document.querySelectorAll('.link-letter').forEach(el => el.classList.add('animate'));

    // ★ 가시성 여부에 맞춰 초기 타이머 동작 시작 (첫 로드 시)
    if (isHeroVisible) {
      allTitleSpans.forEach((span, i) => {
        if (!span) return;
        allTitleStates[i].timerId = setTimeout(() => animateLetter(allTitleSpans, allTitleStates, i, true), Math.random() * 120);
      });
    }

    if (isProjectsVisible) {
      linkSpanGroups.forEach(({ spans, states }) => {
        spans.forEach((span, i) => {
          if (!span) return;
          states[i].timerId = setTimeout(() => animateLetter(spans, states, i, false), Math.random() * 120);
        });
      });
    }

  });
});


</script>
</body>
