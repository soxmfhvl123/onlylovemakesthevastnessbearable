<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>L O V E 4 - Floating & Trail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- Google Fonts — 18 families loaded for dynamic typographic effects -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@400;700;900&family=Space+Mono:wght@400;700&family=Abril+Fatface&family=Righteous&family=Lobster&family=Oswald:wght@300;700&family=Dancing+Script:wght@700&family=Anton&family=Raleway:wght@100;900&family=Cormorant+Garamond:ital,wght@1,700&family=Pacifico&family=Black+Han+Sans&family=Cinzel:wght@900&family=Monoton&family=Bungee&family=Protest+Guerrilla&family=Bruno+Ace+SC&display=swap" rel="stylesheet" />

  <!-- Matter.js Physics Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: sans-serif;
      touch-action: none;
      cursor: crosshair;
    }

    #matter-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
    }
  </style>
</head>
<body>

<canvas id="matter-canvas"></canvas>

<script>
/* ───────────────────────────────────────────
   1. ASSETS & PALETTES
─────────────────────────────────────────────*/
const FONTS = [
  "'Bebas Neue', sans-serif", "'Playfair Display', serif", "'Space Mono', monospace",
  "'Abril Fatface', cursive", "'Righteous', cursive", "'Lobster', cursive",
  "'Oswald', sans-serif", "'Dancing Script', cursive", "'Anton', sans-serif",
  "'Raleway', sans-serif", "'Cormorant Garamond', serif", "'Pacifico', cursive",
  "'Cinzel', serif", "'Monoton', cursive", "'Bungee', cursive",
  "'Protest Guerrilla', sans-serif", "'Bruno Ace SC', cursive",
];

const ALL_COLORS = [
  '#FF2D55','#FF9F0A','#30D158','#0A84FF','#BF5AF2','#FF375F',
  '#FFD60A','#4ECDC4','#F72585','#4CC9F0','#06FFA5','#FF2979',
  '#FF6B00','#FF0099','#00FFCC','#B400FF','#FFBE0B','#FB5607',
  '#FF006E','#8338EC','#00F5D4','#F15BB5','#FEE440','#00BBF9',
  '#FF4D6D','#C77DFF','#FFD166','#06D6A0','#39FF14','#FF073A',
  '#0FF0FC','#FF6EC7',
];

const IMAGE_COLORS = [
  '#19FF3B', '#FFDE19', '#19FF7F', '#45FF19', '#FF19E0', 
  '#FFA519', '#6719FF', '#198FFF', '#FF1922', '#FF8719'
];

function pickFont() { return FONTS[Math.floor(Math.random() * FONTS.length)]; }
function pickColor() { return ALL_COLORS[Math.floor(Math.random() * ALL_COLORS.length)]; }



/* ───────────────────────────────────────────
   2. PHYSICS SETUP
─────────────────────────────────────────────*/
const Engine = Matter.Engine,
      Render = Matter.Render,
      Runner = Matter.Runner,
      World = Matter.World,
      Bodies = Matter.Bodies,
      Body = Matter.Body,
      Events = Matter.Events,
      Composite = Matter.Composite;

const canvas = document.getElementById('matter-canvas');
const ctx = canvas.getContext('2d');

let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

// Create physics engine with ZERO gravity for floating effect
const engine = Engine.create();
engine.world.gravity.y = 0;
engine.world.gravity.x = 0;

// Outer walls to keep balls inside
const wallOptions = { isStatic: true, friction: 0, restitution: 1 };
let ground = Bodies.rectangle(width / 2, height + 50, width * 3, 100, wallOptions);
let ceiling = Bodies.rectangle(width / 2, -50, width * 3, 100, wallOptions);
let leftWall = Bodies.rectangle(-50, height / 2, 100, height * 3, wallOptions);
let rightWall = Bodies.rectangle(width + 50, height / 2, 100, height * 3, wallOptions);

Composite.add(engine.world, [ground, ceiling, leftWall, rightWall]);


/* ───────────────────────────────────────────
   3. SPAWNING FLOATING BALLS
─────────────────────────────────────────────*/
// Spawn 10 floating balls — radius scales with viewport so it looks right on any screen
const NUM_BALLS = 10;
for (let i = 0; i < NUM_BALLS; i++) {
  // 6.5% of the smaller viewport dimension → proportionate on 1080p / 1440p / 2160p / 4K
  const minDim = Math.min(width, height);
  const baseR  = minDim * 0.065;
  const r      = baseR + Math.random() * baseR * 0.55; // baseR ~ 1.55×baseR
  
  // Keep them within the screen bounds initially
  const x = r + Math.random() * (width - 2 * r);
  const y = r + Math.random() * (height - 2 * r);
  
  const ball = Bodies.circle(x, y, r, {
    restitution: 1, // Perfect bounce
    friction: 0,
    frictionAir: 0,
    density: 0.05, // Heavy enough to not be totally pushed away by letters
    label: 'ball'
  });
  
  ball.custom = {
    color: IMAGE_COLORS[i % IMAGE_COLORS.length],
    r: r
  };
  
  // Give them initial floating velocity
  const vx = (Math.random() - 0.5) * 8;
  const vy = (Math.random() - 0.5) * 8;
  Body.setVelocity(ball, { x: vx, y: vy });
  
  Composite.add(engine.world, ball);
}

// Ensure the balls never stop moving or move too fast
Events.on(engine, 'beforeUpdate', function() {
  const bodies = Composite.allBodies(engine.world);
  for (let body of bodies) {
    if (body.label === 'ball') {
      const speed = Matter.Vector.magnitude(body.velocity);
      const minSpeed = 2;
      const maxSpeed = 7;
      
      // If speed falls outside bounds, normalize it
      if (speed < minSpeed || speed > maxSpeed) {
        const targetSpeed = 4.5;
        let factor = targetSpeed / speed;
        if (!isFinite(factor) || speed === 0) {
          Body.setVelocity(body, { x: 4.5, y: 4.5 });
        } else {
          Body.setVelocity(body, { x: body.velocity.x * factor, y: body.velocity.y * factor });
        }
      }
    }
  }
});


/* ───────────────────────────────────────────
   4. MOUSE TRAIL (L-O-V-E)
─────────────────────────────────────────────*/
let charIndex = 0;
const chars = ['L', 'O', 'V', 'E'];
let lastSpawnPos = { x: 0, y: 0 };

function spawnTrail(x, y, isPermanent = false) {
  const char = chars[charIndex % 4];
  charIndex++;
  
  const r = 35 + Math.random() * 15; // Physical radius of letter
  const letter = Bodies.circle(x, y, r, {
    restitution: 0.8,
    frictionAir: 0.05,
    density: 0.01,
    label: 'letter'
  });
  
  letter.custom = {
    char: char,
    font: pickFont(),
    color: pickColor(),
    createdAt: Date.now(),
    lastChange: Date.now(),
    changeInterval: 1100 + Math.random() * 2200, // Change style every 1.1s ~ 3.3s
    lifeTime: isPermanent ? Infinity : 30000 + Math.random() * 2000,
    isPermanent: isPermanent
  };
  
  // Tiny random explosion velocity for trail randomness
  Body.setVelocity(letter, {
    x: (Math.random() - 0.5) * 4,
    y: (Math.random() - 0.5) * 4
  });
  
  Composite.add(engine.world, letter);
}

// Spawn trail on mouse / touch move based on distance
function handleMove(clientX, clientY) {
  const dist = Math.hypot(clientX - lastSpawnPos.x, clientY - lastSpawnPos.y);
  if (dist > 40) { // Spawn every 40px of movement
    spawnTrail(clientX, clientY);
    lastSpawnPos = { x: clientX, y: clientY };
  }
}

window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
window.addEventListener('touchmove', (e) => {
  const touch = e.touches[0];
  handleMove(touch.clientX, touch.clientY);
});

// Pre-spawn 50 random letters scattered across the screen
for (let i = 0; i < 50; i++) {
  const spawnX = Math.random() * width;
  const spawnY = Math.random() * height;
  spawnTrail(spawnX, spawnY, true);
}


/* ───────────────────────────────────────────
   5. RENDER LOOP
─────────────────────────────────────────────*/
const runner = Runner.create();
Runner.run(runner, engine);

function render() {
  ctx.clearRect(0, 0, width, height);
  const bodies = Composite.allBodies(engine.world);
  const now = Date.now();
  
  for (let body of bodies) {
    if (body.isStatic) continue;
    
    // Manage Letter trail lifetime (remove if too old)
    if (body.label === 'letter') {
      const age = now - body.custom.createdAt;
      if (age > body.custom.lifeTime) {
        Composite.remove(engine.world, body);
        continue;
      }
    }
    
    const { position, angle } = body;
    ctx.save();
    ctx.translate(position.x, position.y);
    ctx.rotate(angle);
    
    if (body.label === 'ball') {
      const r = body.custom.r;

      // Plain colored circle with neon glow
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.shadowBlur  = 28;
      ctx.shadowColor = body.custom.color;
      ctx.fillStyle   = body.custom.color;
      ctx.fill();
      // Bright inner core
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.48, 0, Math.PI * 2);
      ctx.fillStyle = body.custom.color + 'CC';
      ctx.shadowBlur = 12;
      ctx.fill();
      
    } else if (body.label === 'letter') {
      const age = now - body.custom.createdAt;
      
      // Dynamic style updating: Change font & color periodically
      if (now - body.custom.lastChange > body.custom.changeInterval) {
        body.custom.font = pickFont();
        body.custom.color = pickColor();
        body.custom.lastChange = now;
      }
      
      if (body.custom.isPermanent) {
        ctx.globalAlpha = 1; // Initial letters stay fully visible forever
      } else {
        // Fade out mouse trail letters gradually towards the end of their lifetime
        const progress = age / body.custom.lifeTime;
        ctx.globalAlpha = Math.max(0, 1 - Math.pow(progress, 6)); 
      }
      
      const r = body.circleRadius;
      ctx.fillStyle = body.custom.color;
      ctx.font = `${r * 1.8}px ${body.custom.font}`; 
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      // Glowing text shadow
      ctx.shadowBlur = 20;
      ctx.shadowColor = body.custom.color;
      
      ctx.fillText(body.custom.char, 0, 0);
    }
    
    ctx.restore();
  }
  
  requestAnimationFrame(render);
}

render();

/* ───────────────────────────────────────────
   6. RESIZE HANDLING
─────────────────────────────────────────────*/
window.addEventListener('resize', () => {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  
  Matter.Body.setPosition(ground, { x: width / 2, y: height + 50 });
  Matter.Body.setPosition(ceiling, { x: width / 2, y: -50 });
  Matter.Body.setPosition(leftWall, { x: -50, y: height / 2 });
  Matter.Body.setPosition(rightWall, { x: width + 50, y: height / 2 });
});

</script>
</body>
</html>
